# Forge — Netlify configuration
# Site: forge-intake.netlify.app (custom domain target: intake.builderbranding.co)
# Hosts the intake questionnaire and sample reports. Functions handle submission webhooks.
#
# Build assembles dist/ from four sources:
#   dist/index.html                        ← skills/intake/templates/questionnaire.html
#   dist/examples/mechanical-magic.html   ← examples/mechanical-magic.html
#   dist/dashboard.html                   ← skills/intake/templates/dashboard.html
#   dist/assets/                          ← assets/ (logos, shared images)
# Adding a new sample report: drop the HTML into examples/ and add a cp line below.

[build]
  publish = "dist"
  command = "mkdir -p dist/examples dist/assets && cp skills/intake/templates/questionnaire.html dist/index.html && cp examples/mechanical-magic.html dist/examples/mechanical-magic.html && cp skills/intake/templates/dashboard.html dist/dashboard.html && cp assets/*.svg dist/assets/"
  functions = "netlify/functions"

# Custom security headers for the hosted form.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Forms detection runs on every deploy. The hidden form definition in
# questionnaire.html (with name="forge-intake" and netlify attribute) gets registered.
